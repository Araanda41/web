<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquiva y aguanta</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body class="noche">
    <main aria-label="Juego de conducción">
        <span class="tornillo superior-izquierdo" aria-hidden="true"></span>
        <span class="tornillo superior-derecho" aria-hidden="true"></span>
        <span class="tornillo inferior-izquierdo" aria-hidden="true"></span>
        <span class="tornillo inferior-derecho" aria-hidden="true"></span>
        <aside class="panel" aria-label="Puntuación y controles">
            <p id="marcador">PUNTOS <span id="puntuacion">0</span></p>
            <div class="instrucciones">
                <div class="control">
                    <p>CAMBIAR DE CARRIL</p>
                    <kbd>←</kbd> <kbd>→</kbd>
                </div>
                <div class="control">
                    <p>DÍA / NOCHE</p>
                    <kbd>↓</kbd> <span>o</span> <kbd>S</kbd>
                </div>
            </div>
        </aside>

        <div class="escenario">
            <section id="carretera" aria-label="Carretera de tres carriles">
                <div class="carril" aria-hidden="true"></div>
                <div class="carril" aria-hidden="true"></div>
                <div class="carril" aria-hidden="true"></div>
                <img id="coche" src="AE86 car/Single frame/AE86 f1.PNG" alt="Tu coche visto desde atrás">
                <div class="fila-obstaculos">
                    <div class="valla" role="img" aria-label="Valla"></div>
                    <div class="valla" role="img" aria-label="Valla"></div>
                    <div class="valla" role="img" aria-label="Valla"></div>
                </div>
                <div class="fila-obstaculos">
                    <div class="valla" role="img" aria-label="Valla"></div>
                    <div class="valla" role="img" aria-label="Valla"></div>
                    <div class="valla" role="img" aria-label="Valla"></div>
                </div>
            </section>

            <section id="fin-partida" hidden>
                <h2>¡Has chocado!</h2>
                <p class="resultado"><span id="puntuacion-final">0</span> puntos</p>
                <button id="reiniciar" type="button">Volver a jugar</button>
            </section>
        </div>
    </main>
</body>
</html>
