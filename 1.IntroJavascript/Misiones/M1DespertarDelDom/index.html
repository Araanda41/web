<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquiva y aguanta</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <h1>Esquiva y aguanta</h1>
        <p id="marcador">Puntos: <span id="puntuacion">0</span></p>

        <section id="carretera" aria-label="Carretera de tres carriles">
            <div class="carril" aria-hidden="true"></div>
            <div class="carril" aria-hidden="true"></div>
            <div class="carril" aria-hidden="true"></div>
            <img id="coche" src="AE86 car/Single frame/AE86 f1.PNG" alt="Tu coche visto desde atrás">
        </section>

        <p class="instrucciones">← → para cambiar de carril · ↓ o S para cambiar entre día y noche</p>

        <section id="fin-partida" hidden>
            <h2>¡Has chocado!</h2>
            <p>Puntuación final: <span id="puntuacion-final">0</span></p>
            <button id="reiniciar" type="button">Volver a jugar</button>
        </section>
    </main>
</body>
</html>
